<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
            cursor: pointer;
        }
        input, select, textarea {
            padding: 10px;
            border: 2px solid #b2bec3;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #0984e3;
            box-shadow: 0 0 8px rgba(9, 132, 227, 0.4);
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        .submit-btn {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #00cec9;
        }
        .submit-btn:focus {
            outline: 3px solid #00cec9;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-link">Home</a>
        <a href="page2.html" class="nav-link">Page 2</a>
        <a href="card.html" class="nav-link">Card</a>
        <a href="contact.html" class="nav-link active">Contact</a>
    </nav>

    <div class="container">
        <h1>Contact Me</h1>
        
        <div class="form-container">
            <form action="#">
                <div class="form-group">
                    <label Packing for="name">Your Name:</label>
                    <input type="text" id="name" required placeholder="Alex">
                </div>

                <!-- Поле email -->
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" required placeholder="alex@example.com">
                </div>

                <div class="form-group">
                    <label for="source">How did you find me?</label>
                    <select id="source" required>
                        <option value="">-- Please choose an option --</option>
                        <option value="search">Search Engine</option>
                        <option value="friend">Recommended by a friend</option>
                        <option value="telegram">Telegram channels</option>
                        <option value="youtube">From youtube</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" required placeholder="Type your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>

</body>
</html>

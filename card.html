<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #dfe6e9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background-color: white; width: 300px; border: 2px solid #b2bec3; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); padding: 24px; text-align: center; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0,0,0,0.2); }
        .card-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; background: #eee; }
        .card h2 { margin: 12px 0 6px 0; font-size: 22px; }
        .card p { color: #636e72; font-size: 14px; margin-bottom: 20px; }
        .links-row { display: flex; justify-content: space-between; gap: 8px; }
        .card-link { flex: 1; padding: 8px 0; background-color: #0984e3; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; transition: background-color 0.2s ease; }
        .card-link:hover { background-color: #00cec9; }
        @media (max-width: 600px) { .card { width: 85%; } .links-row { flex-direction: column; gap: 6px; } }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://fastly.picsum.photos/id/58/1280/853.jpg?hmac=YO3QnOm9TpyM5DqsJjoM4CHg8oIq4cMWLpd9ALoP908" alt="Avatar" class="card-img">
        <h2>Vladislav</h2>
        <p>One line description about you.</p>
        <div class="links-row">
            <a href="#" class="card-link">[kind]</a>
            <a href="#" class="card-link">[helpful]</a>
            <a href="#" class="card-link">[positive]</a>
        </div>
    </div>
</body>
</html>
